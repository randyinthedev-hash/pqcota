site_name: pqcota
docs_dir: docs
theme:
  name: material
  logo: assets/brand/mark-header.svg     # 머리의 앰블럼. 머리가 늘 밝으므로 다크 모드 판이 없는 것을 쓴다
  favicon: assets/brand/favicon.svg
  palette:
    primary: white                       # 앰블럼 색(청록·강조색)이 머리 바탕에 묻히지 않게
  font: false
  language: ko
  features:
    - navigation.sections
    - navigation.indexes
    - search.suggest
plugins:
  - search
markdown_extensions:
  - tables
  - md_in_html
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: warn
    anchors: warn
