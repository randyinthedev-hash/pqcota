# 머리말을 넣을 수 없는 파일(문서·데이터·설정·생성 코드 등)의 저작권과 라이선스.
# precedence = "closest": 파일 안에 SPDX 머리말이 있으면 그것이 우선한다(기존 고지를 덮어쓰지 않는다).
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Great Honor <randyinthedev@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# 이미지 자산: 작성자의 진술(2026-10-06)에 따르면 Claude(Anthropic)로 생성했고, 외부 원본 이미지는 쓰지 않았다.
# 라이선스는 리포와 같다.
[[annotations]]
path = ["docs/images/**", "demo/expected-output/topology.svg"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Great Honor <randyinthedev@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"
