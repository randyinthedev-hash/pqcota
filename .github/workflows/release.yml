name: release

# 태그를 밀면 노드에 올릴 정적 바이너리를 만들어 릴리스에 붙인다.
# 평가하려는 사람이 Go·buf를 깔고 소스를 빌드하게 두지 않기 위해서다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스로 만들 태그 (예: v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # JVM attach 사이드카 — 레거시 JVM에 붙어야 해서 --release 8로 빌드된다.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: 계약 생성
        run: make tools && make generate

      # 노드에 올리는 것은 이 셋뿐이다(배포 설계). arch만 바꿔 정적으로 만든다.
      - name: collector 정적 빌드
        run: |
          set -eu
          for arch in amd64 arm64; do
            out="dist/pqcota-linux-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "$out/" \
              ./discovery/cmd/pqcota-nodescan \
              ./discovery/cmd/pqcota-netcap \
              ./discovery/cmd/pqcota-jvmscan
            file "$out"/* | grep -q 'statically linked' \
              || { echo "✗ $arch: 정적 링크가 아니다 — 배포판·libc를 가리게 된다"; exit 1; }
            tar -C dist -czf "dist/pqcota-linux-$arch.tar.gz" "pqcota-linux-$arch"
          done

      - name: JVM 사이드카
        run: |
          make build-jar
          [ -f build/collector.jar ] && cp build/collector.jar dist/ || echo "collector.jar 없음 — attach 경로는 이 릴리스에 없다"

      # 받은 사람이 무결성을 확인할 수 있어야 한다. 서명은 아직 없다(로드맵).
      # collector.jar가 없을 수 있다(javac 없는 환경) — 그때 sha256sum이 실패해
      # 릴리스 전체가 멈추면 안 된다. 있는 것만 센다.
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz $([ -f collector.jar ] && echo collector.jar) | tee SHA256SUMS

      - name: 릴리스 발행
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          REPO_URL="https://github.com/$GITHUB_REPOSITORY"
          {
            echo "**pqcota** — 실행 중인 시스템이 실제로 쓰는 암호를 관측하고, 그 관측을 근거로 PQC 전환"
            echo "산출물을 만드는 오픈소스 플랫폼. 관측 → 인벤토리 → 전환물 생성 3단계가 리눅스에서 종단으로 동작한다."
            echo
            echo "### 받는 것"
            echo
            echo "| 파일 | 무엇 |"
            echo "|---|---|"
            echo "| \`pqcota-linux-amd64.tar.gz\` · \`pqcota-linux-arm64.tar.gz\` | **노드에 올리는 collector 3종** — \`pqcota-nodescan\` · \`pqcota-netcap\` · \`pqcota-jvmscan\` |"
            echo "| \`collector.jar\` | JVM attach 경로를 쓸 때만. 실행 중 JVM의 provider 체인을 조회하는 사이드카 |"
            echo "| \`SHA256SUMS\` | 무결성 확인용 — \`sha256sum -c SHA256SUMS\` |"
            echo
            echo "정적 링크라 배포판·libc를 가리지 않는다. **커널 3.2 이상**이면 된다. 운영자 CLI는 중앙에서만"
            echo "쓰므로 이 번들에 없다."
            echo
            echo "### 먼저 돌려보려면"
            echo
            echo "Docker만 있으면 전 범위가 한 번에 돈다 — 관측부터 전환물 생성·적용·되돌림까지."
            echo
            echo '```bash'
            echo "git clone $REPO_URL && cd ${GITHUB_REPOSITORY#*/}"
            echo "./demo/scripts/up.sh && ./demo/scripts/demo.sh"
            echo '```'
            echo
            echo "실물 provider로 능력이 실제로 생기는지까지 재려면 \`DEMO_REAL_PROVIDER=1\`을 붙인다."
            echo
            echo "버전별 목표와 성과: [RELEASE_NOTES.md]($REPO_URL/blob/$TAG/RELEASE_NOTES.md)"
          } > /tmp/relnotes.md
          # v0.1.0-rc.1 처럼 하이픈이 붙은 태그는 사전 릴리스다 — 안정판으로 올라가면
          # 받는 사람이 시험용을 정식으로 착각한다.
          case "$TAG" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$TAG" $PRE \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file /tmp/relnotes.md \
            dist/*.tar.gz dist/SHA256SUMS $([ -f dist/collector.jar ] && echo dist/collector.jar)
