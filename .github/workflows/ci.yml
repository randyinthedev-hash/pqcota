name: ci

# 기여 문서가 요구하는 검사를 사람이 기억하지 않아도 걸리게 한다.
# 리눅스 러너라 `//go:build linux` collector도 함께 컴파일된다 — 다른 OS에서는
# 아예 빌드되지 않으므로 여기서 도는 것이 곧 실물 커버리지다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres 케이스(TV-RETENTION-8·TV-ORG-4·TV-ATTR-7·8·TP-RECORD-3)가 여기서 돌게 한다.
    # 조직 격리는 **한 테이블을 공유하는 쪽에서만** 잴 수 있어, 인메모리 케이스가 통과해도
    # 증명되지 않는다. DSN이 없으면 그 다섯이 조용히 스킵되고 격리는 확인되지 않은 채 초록이 된다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pqcota
          POSTGRES_PASSWORD: pqcota
          POSTGRES_DB: pqcota
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 계약 하위호환 검사가 **릴리스 태그를 기준선**으로 쓴다 — 얕은 클론이면 태그가 없어
      # 검사가 조용히 건너뛴다. 게이트가 스스로 꺼지는 상태를 만들지 않는다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 사이드카는 --release 8로 빌드한다(레거시 JVM에 붙어야 해서).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # buf 버전을 고정한다 — gen/이 커밋돼 있으므로, 버전이 바뀌어 출력이 달라지면
      # 아래 드리프트 검사가 코드 변경 없이도 실패한다.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.69.0

      # 계약이 SSOT다 — 생성 코드가 proto와 어긋나면 여기서 끊는다.
      - name: generate
        run: |
          make tools
          make generate
          git diff --exit-code --stat || {
            echo "✗ 생성 코드가 proto와 어긋난다 — 로컬에서 make generate 후 커밋할 것"
            exit 1
          }

      - name: lint (proto)
        run: make lint

      # 이미 릴리스한 계약을 깨지 않는지. 태그 전에는 기준선이 없어 건너뛴다(이유를 로그에 남긴다).
      - name: 계약 하위호환 (buf breaking)
        run: make breaking

      - name: fmt / vet
        run: |
          make fmt-check
          make vet

      # 문서 게이트 — 끊긴 링크·빈 절·개인 환경 정보·취소선 사고를 막는다.
      - name: check-docs
        run: make check-docs

      - name: check-collectors
        run: make check-collectors

      - name: check-gates
        run: make check-gates

      # 다른 티어를 지목하는 표현이 새어 들어오지 않게 한다.
      - name: check-boundary
        run: make check-boundary

      - name: build
        run: |
          make build
          make build-jar

      # integration은 환경이 없으면 스스로 스킵한다 — 스킵은 통과가 아니므로
      # 무엇이 건너뛰었는지 로그에 남긴다. `-v` 없이 돌리면 스킵이 아예 찍히지 않아
      # 이 약속이 지켜지지 않았다. 출력은 `-v` 로 받아 두고 요약만 낸다.
      - name: test
        env:
          PQCOTA_TEST_DSN: postgres://pqcota:pqcota@localhost:5432/pqcota?sslmode=disable
        run: |
          set +e
          go test ./... -count=1 -v > /tmp/test.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # 실패하면 요약만 봐서는 원인을 못 짚는다. 통째로 낸다.
            cat /tmp/test.log
          else
            grep -E '^ok  ' /tmp/test.log
          fi
          echo "── 건너뛴 케이스 (스킵은 통과가 아니다)"
          if grep -qE '^ *--- SKIP' /tmp/test.log; then
            grep -E '^ *--- SKIP' /tmp/test.log | sed 's/^ *//'
          else
            echo "  없다"
          fi
          exit $status

      # TD-NETWORK-15는 `CAP_NET_RAW`가 **있어야** 돈다. 러너는 권한이 없어 위 실행에서
      # 스킵되는데, 정반대로 TD-NETWORK-16은 권한이 없어야 도니 한 번에 둘을 재지 못한다.
      # 그래서 15만 여기서 다시 돌린다. `sudo go test`가 아니라 **바이너리를 먼저 만들고**
      # 그것을 sudo로 돌린다 — root가 빌드 캐시에 쓰면 뒤 스텝이 권한으로 깨진다.
      # 스킵은 통과가 아니므로 PASS가 찍혔는지까지 본다.
      - name: test (CAP_NET_RAW가 있어야 도는 케이스)
        run: |
          set -o pipefail
          go test -c -o /tmp/netcap.test ./discovery/collectors/network/
          sudo /tmp/netcap.test -test.run TestObserveFillsTheWholeWindow -test.v | tee /tmp/n15.log
          grep -q '^--- PASS: TestObserveFillsTheWholeWindow' /tmp/n15.log || {
            echo "✗ TD-NETWORK-15가 돌지 않았다 — sudo에도 CAP_NET_RAW가 없다면 이 스텝이 무의미하다"
            exit 1
          }

  # 노드에 올리는 것은 정적 바이너리다. arch를 바꿔도 서는지 확인한다.
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # buf 버전을 고정한다 — gen/이 커밋돼 있으므로, 버전이 바뀌어 출력이 달라지면
      # 아래 드리프트 검사가 코드 변경 없이도 실패한다.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.69.0
      - run: make tools && make generate
      - name: collector 정적 빌드 (${{ matrix.goarch }})
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o dist/linux-${GOARCH}/ \
            ./discovery/cmd/pqcota-nodescan \
            ./discovery/cmd/pqcota-netcap \
            ./discovery/cmd/pqcota-jvmscan
          file dist/linux-${GOARCH}/* | tee /dev/stderr | grep -q "statically linked" \
            || { echo "✗ 정적 링크가 아니다 — 배포판·libc를 가리게 된다"; exit 1; }

      # CNG collector가 자랄 타깃. 산출물을 내지 않고 컴파일만 본다 — 리눅스 전용 코드가
      # 빌드 태그 밖으로 새면 Windows에서만 깨지고, 그건 여기서만 잡힌다.
      - name: windows 교차 컴파일 (${{ matrix.goarch }})
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./...
