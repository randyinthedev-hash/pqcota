name: ci

# 이 리포의 검사를 사람이 기억하지 않아도 걸리게 한다. 리포 사이에 걸친 검사(import 방향·게이트 배선·문서 링크의
# 교차 확인)는 통합 리포 pqcota의 ci.yml이 다섯 리포를 함께 받아 잰다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 계약 하위호환은 pqcota-common의 CI가 맡는다. 여기서는 다섯 리포를 **함께** 받아
      # 리포 사이에 걸친 검사만 한다.
      # 형제 리포를 이 리포와 **나란히** 받는다 — go.mod가 replace로 ../ 를 읽는 배치다.
      - uses: actions/checkout@v7
        with:
          path: pqcota
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: randyinthedev-hash/pqcota-common
          path: pqcota-common
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: randyinthedev-hash/pqcota-inventory
          path: pqcota-inventory
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: randyinthedev-hash/pqcota-discovery
          path: pqcota-discovery
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: randyinthedev-hash/pqcota-provisioning
          path: pqcota-provisioning
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: pqcota/go.mod
          cache: true
          cache-dependency-path: pqcota/go.sum

      # 사이드카는 --release 8로 빌드한다(레거시 JVM에 붙어야 해서).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: fmt / vet
        working-directory: pqcota
        run: |
          make fmt-check
          make vet

      # 문서 게이트 — 끊긴 링크·빈 절·개인 환경 정보·취소선 사고를 다섯 리포에서 막는다.
      - name: check-docs
        working-directory: pqcota
        run: make check-docs

      - name: check-collectors
        working-directory: pqcota
        run: make check-collectors

      - name: check-gates
        working-directory: pqcota
        run: make check-gates

      # 단계 사이의 import 방향을 다섯 리포 전체에서 잰다.
      - name: check-deps
        working-directory: pqcota
        run: make check-deps

      # 문체 게이트 — 한 번 걷어낸 한국어 표현이 문서·HTML·도구 출력에 다시 들어오는 것을 막는다.
      - name: check-prose
        working-directory: pqcota
        run: make check-prose

      # 다른 티어를 지목하는 표현이 새어 들어오지 않게 한다.
      - name: check-boundary
        working-directory: pqcota
        run: make check-boundary

      - name: build
        working-directory: pqcota
        run: |
          make build
          make build-jar

      - name: test
        working-directory: pqcota
        run: go test ./... -count=1
