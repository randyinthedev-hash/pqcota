name: site

# 온라인 문서 사이트를 만든다. 수동 실행만 한다(푸시로는 돌지 않는다).
# 다섯 리포의 같은 릴리스 태그에서 문서를 받고, 빌드 도구(tools/site)는 입력 tools의 커밋 SHA에서 받아 빌드한다. deploy를 켜야만 배포 작업이 돈다.
# 배포는 Pages 소스가 'GitHub Actions'일 때만 의미가 있다(지금 소스를 바꾸는 것은 이 파일의 일이 아니다).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '다섯 리포에서 같이 받을 릴리스 태그 (예: v0.10.1)'
        required: true
      tools:
        description: '빌드 도구(tools/site)를 받을 pqcota 커밋 SHA (40자). 문서는 ref 태그에서, 도구는 이 커밋에서 받는다'
        required: true
      deploy:
        description: 'Pages에 배포한다 (끄면 빌드와 검사만)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  REF: ${{ inputs.ref }}
  TOOLS: ${{ inputs.tools }}
  ORG: randyinthedev-hash

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 다섯 리포를 같은 태그로 받기
        run: |
          mkdir ws && cd ws
          for r in pqcota pqcota-common pqcota-inventory pqcota-discovery pqcota-provisioning; do
            git clone -q "https://github.com/$ORG/$r.git" "$r"
            git -C "$r" checkout -q --detach "refs/tags/$REF"
            echo "$r $(git -C "$r" rev-parse HEAD)" | tee -a ../refs.txt
          done
      - name: 빌드 도구를 고정된 커밋에서 받기
        run: |
          [[ "$TOOLS" =~ ^[0-9a-f]{40}$ ]] || { echo "tools는 40자 커밋 SHA여야 한다"; exit 1; }
          git clone -q "https://github.com/$ORG/pqcota.git" tools-src
          git -C tools-src checkout -q --detach "$TOOLS"
          git -C tools-src rev-parse HEAD
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 도구 설치 (고정 목록과 같아야 한다)
        run: |
          pip install -r tools-src/tools/site/requirements.txt
          pip freeze | diff - tools-src/tools/site/requirements.txt
      - name: 빌드 (쪽 목록 고정, 랜딩·구조도·원문 얹기, 최종 트리 링크 검사)
        run: PAGES=ws/pqcota/tools/site/pages.txt TOOLS_REF="$TOOLS" tools-src/tools/site/build.sh ws site "$REF"
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
