// PQC 마이그레이션 플랫폼 — 공유 어휘 (SSOT, 단계 가로지름)
//
// 세 단계(discovery/inventory/deploy)가 모든 경계에서 공유하는 통제 어휘·Envelope.
// pkg/kernel의 계약판 — 어느 한 단계에 속하지 않는 "공유 어휘"만 여기 둔다.
//
// 통제 어휘(enum)는 규정서 열거형과 1:1이며, 0값은 항상 UNSPECIFIED = "unknown"(§2.5).

syntax = "proto3";

package pqcota.common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/randyinthedev-hash/pqcota/gen/pqcota/common/v1;commonv1";

// ─────────────────────────────────────────────────────────────────────────
// 통제 어휘 (수용 원칙 §2.4 · 규정서 §2.4) — 전 단계 공유
// ─────────────────────────────────────────────────────────────────────────

// 암호 런타임 — 모든 finding·자산·조치의 1급 분기 필드.
// 무엇을 런타임으로 받는지: docs/runtime-acceptance.md
enum CryptoRuntime {
  CRYPTO_RUNTIME_UNSPECIFIED = 0; // unknown — 판별 불가 (§2.5)
  CRYPTO_RUNTIME_OPENSSL = 1;     // openssl
  CRYPTO_RUNTIME_JCA = 2;         // jca (Java JCE/JCA)
  // Windows CNG (Cryptography Next Generation) — provider(KSP/SSP) 아키텍처라 peer 런타임.
  // 단계적 도입: 이 값은 v0.1.0에서 **스키마로만 예약**한다(디스커버리·프로비저닝 미구현).
  // 디스커버리(콜렉터)는 다음 릴리스, 프로비저닝은 그 다음(substrate 일반화 선행).
  // 상세: docs/런타임_확장_계약.md
  CRYPTO_RUNTIME_WIN_CNG = 3;
  // Python cryptography·Go crypto·Node·.NET는 대개 openssl/CNG 쪽으로 묶인다(peer 아님) — 위 문서 참조.
}

// 탐지 방법 (규정서 §2.3 표의 detection_method 열). Collector가 신고한다.
// evidence_strength는 이 값에서 결정론적으로 파생된다(코어 책임, §2.5 AUTO).
enum DetectionMethod {
  DETECTION_METHOD_UNSPECIFIED = 0;      // unknown
  DETECTION_METHOD_SOURCE = 1;           // Hyperion 등 소스 스캔 → confirmed
  DETECTION_METHOD_ARTIFACT = 2;         // Theia·JAR 스캔 → inferred-high
  DETECTION_METHOD_SYMBOL_ANALYSIS = 3;  // 정적 바이너리 심볼/문자열 → inferred-low
  // 실행 중인 프로세스에 무엇이 **로드·등록**돼 있나(/proc·getProviders()) → confirmed
  DETECTION_METHOD_RUNTIME_INTROSPECTION = 4;
  // 그 코드가 **실제로 호출**되나(eBPF·ltrace) → confirmed. 등록≠사용이라 4와 뜻이 다르다.
  // 침습적이라 이 리포의 collector가 수집하지 않는다. 외부 도구가 낸 CBOM도 수신 어댑터가
  // Envelope를 ARTIFACT로 고정하므로 이 리포에서는 나오지 않는다 — 계약 어휘로만 둔다.
  DETECTION_METHOD_DYNAMIC_TRACE = 5;
}

// 증거 강도 (규정서 §2.3). detection_method에서 파생 — 원본이 아닌 파생 뷰(§1.2).
// 코어 정규화 파이프라인만이 이 값을 채운다. Collector 출력에는 존재하지 않는다.
enum EvidenceStrength {
  EVIDENCE_STRENGTH_UNSPECIFIED = 0; // unknown (§2.5)
  EVIDENCE_STRENGTH_CONFIRMED = 1;
  EVIDENCE_STRENGTH_INFERRED_HIGH = 2;
  EVIDENCE_STRENGTH_INFERRED_LOW = 3;
}

// 사용 맥락 (수용 원칙 §2.4). 소스 부재 시 열화될 수 있는 필드(§2.3).
enum UsageContext {
  USAGE_CONTEXT_UNSPECIFIED = 0; // unknown / 열화됨
  USAGE_CONTEXT_SERVER = 1;
  USAGE_CONTEXT_CLIENT = 2;
  USAGE_CONTEXT_AT_REST = 3;
  USAGE_CONTEXT_SIGNING = 4;
}

// 수집 계층 (규정서 §2.2 collector 지형). 완전성 맵의 단위(§2.6).
enum CollectionLayer {
  COLLECTION_LAYER_UNSPECIFIED = 0;
  COLLECTION_LAYER_SOURCE = 1;            // 소스/아티팩트 collector
  COLLECTION_LAYER_ARTIFACT = 2;
  COLLECTION_LAYER_PROCESS = 3;           // 런타임/프로세스
  COLLECTION_LAYER_NETWORK = 4;
  COLLECTION_LAYER_JVM_INTROSPECTION = 5; // JCA 전용 (§2.2 자체 구현 공백)
  // CNG 전용. JCA와 같은 이유로 자기 계층을 둔다 — 프로세스도 아티팩트도 아니고
  // **머신에 등록된 provider를 조회**한 것이라, 무엇을 보고 무엇을 못 봤는지가 다른 계층과 다르다.
  COLLECTION_LAYER_CNG_INTROSPECTION = 6;
}

// OpenSSL 바인딩 방식 (수용 원칙 §2.4).
enum OpensslBindingMode {
  OPENSSL_BINDING_MODE_UNSPECIFIED = 0; // unknown
  OPENSSL_BINDING_MODE_DYNAMIC = 1;
  OPENSSL_BINDING_MODE_STATIC = 2;
  OPENSSL_BINDING_MODE_DLOPEN = 3;
  OPENSSL_BINDING_MODE_VENDORED = 4;
}

// JCA provider 등록 방식 (수용 원칙 §2.2 (a)~(c) · §2.3).
enum JcaRegistrationMode {
  JCA_REGISTRATION_MODE_UNSPECIFIED = 0; // unknown
  JCA_REGISTRATION_MODE_STATIC = 1;   // java.security 정적 순서 목록
  JCA_REGISTRATION_MODE_DYNAMIC = 2;  // addProvider() 런타임 주입 (파일 스캔 사각지대)
  JCA_REGISTRATION_MODE_EXPLICIT = 3; // getInstance("...","BC") 명시 지목
}

// ─────────────────────────────────────────────────────────────────────────
// Envelope (규정서 §2.6 · §3.1) — 모든 수집 산출물의 provenance
// ─────────────────────────────────────────────────────────────────────────

message Envelope {
  string collector_id = 1;                       // 예: "openssl-collector"
  string collector_version = 2;                  // 예: "0.1.0"
  DetectionMethod detection_method = 3;          // 이 수집의 주 탐지 방법
  // 이 수집이 **실제로 일어난** 시각. collector가 캡처 시점에 채운다 — 적재·출력 시각이 아니다.
  // 비우지 않는다: Envelope의 목적이 provenance이고, 서명(§2.6)이 이 값을 덮는다.
  // 관측에 실패한 결과(완전성 갭)에도 채운다 — **언제 시도했는지**가 갭 기록의 근거다.
  google.protobuf.Timestamp collected_at = 4;
  string target_node_id = 5;                      // 스코프 마스터 앵커 = 권위 머신 ID (§1.4)
  string scope_master_ref = 6;                    // 대조 대상 CMDB 스냅샷 참조
  string signature = 7;                           // collector 서명 (예: "ed25519:...") (§2.6)
  string collector_license = 8;                   // "Apache-2.0" | "GPL-3.0-or-later" (라이선스 정리 — 선택 UX)
  MachineIdentity machine = 9;                    // 머신 상관 지문 — node_id 잇기·검증·self-id (§1.4)
}

// MachineIdentity — 머신 상관·자동 UID 부여의 근거 지문(§1.4). collector(Ansible/수동 무관)가 채운다.
// 권위 ID(target_node_id=CMDB)를 이 지문으로 상관·검증하고, CMDB 없으면 여기서 결정론적 self-id를 파생한다.
// IP는 ID가 아니라 로케이터 — 네트워크 관측을 노드로 잇는 데만 쓴다.
message MachineIdentity {
  string machine_id = 1;        // /etc/machine-id (systemd, 안정 per-install UUID) — 단일 로컬 키 최선
  string hardware_uuid = 2;     // DMI product_uuid (VM/HW). root 필요
  string cloud_instance_id = 3; // 클라우드 메타데이터 instance-id (있으면 권위적)
  string fqdn = 4;              // 정규화된 호스트명
  repeated string ips = 5;      // 관측 IP(들) — 로케이터(ID 아님)

  // CMDB 미등재 시 지문에서 파생한 결정론적 self-id(§1.4 RegistrationRequest). 같은 머신→같은 값(중복 없음).
  string self_assigned_id = 6;
  string derived_from = 7;      // self_assigned_id를 뽑은 지문 종류 (예: "machine-id", "cloud-instance-id")
}

// ─────────────────────────────────────────────────────────────────────────
// 완전성 맵 (규정서 §2.6) — 계층별 커버리지
// "실제 없음"과 "원리상 못 봄"을 혼동하지 않기 위한 핵심 구조.
// ─────────────────────────────────────────────────────────────────────────

message Completeness {
  repeated CollectionLayer layers_covered = 1;
  repeated CollectionLayer layers_missing = 2; // 갭. 자동 "부재" 처리 금지 (§2.5, §2.6)
  string note = 3;                             // 예: "프로세스 계층 미수집 — 대상 미실행"
}
