// PQC 마이그레이션 플랫폼 — 리뷰 판정(Decision) 스키마 (SSOT, INVENTORY 단계)
//
// 인벤토리 설계 §2(Decision)·§3.3③(리뷰-확정 상태기계)·§3.6(근거 해시 무효화).
// 리컨실리에이션 항목에 대한 리뷰어의 판정. FinalizedPlan(provisioning.v1)의 인벤토리 짝 —
// 판정들이 finalize되면 확정 계획으로 이어진다.
//
// 스키마만 여기 둔다 — **판정 엔진·영속화·거버넌스는 구현하지 않는다.** 그래도 계약에 두는 이유는
// 소비자 엔진이 같은 어휘를 쓰게 하려는 것이다(FinalizedPlan과 같은 논리).

syntax = "proto3";

package pqcota.inventory.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/randyinthedev-hash/pqcota/gen/pqcota/inventory/v1;inventoryv1";

// 판정 lifecycle (§3.3③). finalize 전에는 프로비저닝 실행 불가(§3.7). PlanStatus(provisioning)와 평행.
enum DecisionStatus {
  DECISION_STATUS_UNSPECIFIED = 0;
  DECISION_STATUS_DRAFT = 1;
  DECISION_STATUS_IN_REVIEW = 2;
  DECISION_STATUS_FINALIZED = 3; // 승인 서명 완료 → 확정 계획 편입 가능
}

// 선언(CMDB)과 관측을 대조한 결과 (§3.3①).
//
// 스키마만 여기 둔다 — **대조 엔진은 구현하지 않는다**(§6.2). DecisionConclusion·FinalizedPlan과
// 같은 논리다: 소비자 엔진이 같은 어휘를 쓰게 하려는 것.
enum ReconState {
  RECON_STATE_UNSPECIFIED = 0;
  RECON_STATE_CONFIRMED = 1;   // 선언 ∩ 관측
  RECON_STATE_UNDECLARED = 2;  // 관측만 — 선언에 없는 통신(shadow). 보안에서 먼저 본다
  RECON_STATE_UNOBSERVED = 3;  // 선언만 — 실존·stale·관측 갭 중 하나. 기계가 확정하지 않는다
}

// 리뷰어의 결론 — 특히 UNOBSERVED(선언 only) 항목의 판정(§3.3①: 실존 vs stale vs 갭).
enum DecisionConclusion {
  DECISION_CONCLUSION_UNSPECIFIED = 0;
  DECISION_CONCLUSION_EXISTS = 1;    // 실존 — 실제 존재(DR·배치 등), 관측 갭이었음
  DECISION_CONCLUSION_STALE = 2;     // stale — 선언은 있으나 실제 없음(정리 대상)
  DECISION_CONCLUSION_EXCLUDED = 3;  // 제외 — 스코프 밖/의도적 무시
  DECISION_CONCLUSION_APPROVED = 4;  // 승인 — remediation 대상으로 확정
}

// 판정 한 건 (인벤토리 설계 §2 Decision). 리뷰어가 리컨실리에이션 항목·정책 템플릿에 내린다.
message Decision {
  string id = 1;
  string subject = 2;   // 대상: 통신 엣지 ID 또는 정책 템플릿 ID(정책 단위 판정 §3.4)
  DecisionConclusion conclusion = 3;
  DecisionStatus status = 4;

  string reviewer = 5;    // 판정 주체
  string signature = 6;   // 승인 서명 — finalize 필수(§3.3③)
  string basis_hash = 7;  // 판정 근거 증거의 해시 → 근거 변하면 무효화 트리거(§3.6 델타 리뷰)

  string derived_from_snapshot_id = 8; // 어떤 리컨실리에이션 스냅샷에 대한 판정인가(§1.2)
  google.protobuf.Timestamp decided_at = 9;

  // 무엇에 대한 판정인가 — 대조 결과. 이것이 없으면 소비자가 conclusion만 받고
  // 그 판정이 어떤 상태를 두고 내려진 것인지 알 수 없다.
  ReconState state = 10;
}
