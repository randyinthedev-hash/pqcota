// PQC 마이그레이션 플랫폼 — 프로비저닝 히스토리·롤백 모델 (SSOT, PROVISIONING 단계)
//
// 규정서 §1.3(행위 계열 provenance)·§4.3(단계 경계=롤백 지점)· 프로비저닝 설계 §4.1("cnf 한 줄 롤백").
// 프로비저닝 *전* before 상태(기존 암호 모듈·config·provider 체인)를 캡처해 append-only 보존.
// 롤백 = before 복원 + 재시작. 스키마가 SSOT이고, 역방향 플레이북도 이 리포가 생성한다
// (L3면 activation.deactivate로 활성화까지 되돌린다). 플릿 오케스트레이션은 밖(§4.3).

syntax = "proto3";

package pqcota.provisioning.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/randyinthedev-hash/pqcota/gen/pqcota/provisioning/v1;provisioningv1";

// CryptoState — 특정 시점 애플리케이션의 암호 상태 스냅샷(롤백 기준). before/after 모두 이 형태.
message CryptoState {
  // 로드/설치된 암호 모듈 + 버전. 예: "libcrypto.so.3@3.0.13", "oqsprovider@0.6.1", "bcprov-jdk18on@1.78.1".
  repeated string modules = 1;
  string config_digest = 2;             // 관련 config(openssl.cnf/java.security)의 해시 — 변화 감지
  repeated string provider_chain = 3;   // JCA provider 등록 순서(수용 원칙 §2.2(d)) 등
  string config_snapshot_ref = 4;       // 롤백용 config 원문 보존 참조(내용/블롭 ID). 원본 복원의 근거.
}

// 프로비저닝 진행 상태. 단계 경계가 롤백 지점(§4.3).
enum ProvisioningStatus {
  PROVISIONING_STATUS_UNSPECIFIED = 0;
  PROVISIONING_STATUS_STAGED = 1;      // L1 — 모듈 배치만
  PROVISIONING_STATUS_INSTALLED = 2;   // L2 — 모듈+config 배치(미활성)
  PROVISIONING_STATUS_ACTIVATED = 3;   // L3 — 활성화+재시작 완료(플레이북 적용 후의 상태)
  PROVISIONING_STATUS_ROLLED_BACK = 4; // before 복원됨
  PROVISIONING_STATUS_FAILED = 5;      // 실패(부팅검증 실패 등) → 롤백 대상
}

// ProvisioningRecord — 프로비저닝 행위 1건의 append-only 히스토리(§1.3 행위 계열).
// before를 보존하므로 언제든 롤백 가능. 재스캔 폐루프(§4.3)로 after가 실제 반영됐는지 확인.
message ProvisioningRecord {
  string id = 1;
  string node_id = 2;          // 머신 앵커(§1.4)
  // 이 조치가 영향을 주는 애플리케이션(들). 공유 라이브러리 교체는 그걸 로드한 모든 앱에 영향이라
  // 다중일 수 있다(cbom Finding.app_keys에서 유래). 각 원소가 (node_id,app_key)=전역 유일.
  repeated string app_keys = 3;
  string action_id = 4;        // 근거 RemediationAction(plan.proto) 참조
  string plan_id = 5;          // 소속 FinalizedPlan

  CryptoState before = 6;      // 프로비저닝 *전* 상태 — **롤백 기준**
  CryptoState after = 7;       // 적용 후 목표/실측 상태

  ProvisioningStatus status = 8;
  string note = 9;             // 실패 사유·검증 결과 등
  google.protobuf.Timestamp at = 10;
}
