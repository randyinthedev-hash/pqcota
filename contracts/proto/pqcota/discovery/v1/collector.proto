// PQC 마이그레이션 플랫폼 — Collector Intake 계약 (SSOT, DISCOVERY 단계)
//
// 규정서 §1.6: 코어는 "노드를 주면 정규화된 CBOM을 반환한다"는 collector 추상만 의존한다.
//              그 뒤가 CBOMkit인지 CipherIQ인지 자체 collector인지 코어는 몰라야 한다.
// 이 gRPC 경계가 곧 라이선스 정리 GPL 전염 차단 경계다(프로세스 분리 + CycloneDX만 교환).
//
// 책임 경계(정밀화):
//   Collector = 규정서 §2.4 step 1~2 (원시 포집 + 표준 CycloneDX 변환) + Envelope.
//   정규화     = §2.4 step 3~6 (강화·검증·동일성해소·영속화) → 파생 Finding[] 생성.

syntax = "proto3";

package pqcota.discovery.v1;

import "pqcota/common/v1/common.proto";
import "pqcota/discovery/v1/edge.proto";

option go_package = "github.com/pqcota/pqcota/gen/pqcota/discovery/v1;discoveryv1";

service Collector {
  // 능력 신고 — 코어가 완전성 맵·계층 커버리지·라이선스 UX(라이선스 정리)를 판단하는 근거.
  rpc Describe(DescribeRequest) returns (CollectorCapabilities);

  // 수집 실행 — 정규화된 CBOM Envelope를 스트림으로 반환.
  // 대상 노드는 코어가 스코프 마스터로 이미 게이트한 목록만 전달된다(§1.4).
  rpc Collect(CollectRequest) returns (stream CollectionResult);
}

message DescribeRequest {}

message CollectorCapabilities {
  string collector_id = 1;
  string version = 2;
  repeated pqcota.common.v1.CryptoRuntime crypto_runtimes = 3;   // 지원 런타임
  repeated pqcota.common.v1.CollectionLayer layers = 4;          // 커버 가능 계층 (완전성 맵 기준)
  repeated pqcota.common.v1.DetectionMethod detection_methods = 5;
  string license = 6;                           // 라이선스 정리: "Apache-2.0" | "GPL-3.0-or-later"
  bool invasive = 7;                            // dynamic-trace 등 침습적이면 true → 코어가 PROPOSE 게이트 (§2.5)
}

message CollectRequest {
  // 스코프 마스터 게이트 통과 노드만. Collector는 받은 노드만 수집(§1.4 책임은 코어).
  repeated string target_node_ids = 1;
  string scope_master_ref = 2;
  // 침습 옵션(예: enable_dynamic_trace) — 코어의 PROPOSE 승인 후에만 채워진다(§2.5).
  map<string, string> options = 3;
}

// Collector가 반환하는 "정규화된 CBOM Envelope" 한 단위 (노드당 1개 이상).
message CollectionResult {
  pqcota.common.v1.Envelope envelope = 1;  // §3.1 Envelope (provenance + 서명 + detection_method)

  // 원시 포집 — collector 네이티브 출력 불변 보존(§2.4 step 1). 코어가 append-only로 영속화,
  // 강화 규칙 개선 시 여기서 재정규화(§1.2). 표준 아님(도구 고유).
  //
  // **여기에 담지 않는 것** — 설정 파일 원문, 패킷 페이로드, 자격증명(키·비밀번호·토큰).
  // 이 필드는 자유형 bytes라 스키마가 막아 주지 않는다. 그래서 규약으로 적는다: collector가
  // **자기가 판정한 결과**를 그 도구의 형식으로 담는 자리이지, 읽은 것을 그대로 실어 보내는
  // 자리가 아니다. 관측 대상의 내용을 나르기 시작하면 이 결과물은 더 이상 인벤토리가 아니라
  // 사본이 된다 — 받는 쪽이 무엇을 보관하게 되는지가 달라진다.
  bytes raw_capture = 2;
  string raw_format = 3;             // 예: "openssl-collector/native-v1", "cbomkit/theia-json"

  // 정규화된 CycloneDX CBOM(ECMA-424) 표준 본문(§2.4 step 2). 상호운용 보장 계층(§3.2).
  // 도구 고유 enrichment는 표준 `properties` 확장에 실림 — 키 규약은 contracts/README.md.
  bytes cbom_cyclonedx = 4;
  string cyclonedx_spec_version = 5; // "1.6" | "1.7" — 코어가 내부 정규 버전으로 수렴(§3.2)

  pqcota.common.v1.Completeness completeness = 6;  // 이 결과가 커버/미커버한 계층 (§2.6)

  // 관측된 통신 엣지 (인벤토리 설계 §6, network-collector). 노드 내부 자산(cbom_cyclonedx)과 달리
  // 노드 간 관계라 CycloneDX 본문이 아닌 별도 목록으로 운반한다. posture는 코어가 파생(§1.2).
  repeated ObservedEdge observed_edges = 7;
}
