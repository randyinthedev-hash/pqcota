[defaults]
# 접속 정보(user·key)는 pqcota-hosts가 hosts.csv에서 생성하는 targets.ini에 실린다 — 여기 두지 않는다.
# (접근 비밀을 우리 인벤토리·설정에 영속하지 않음을 데모로 보이기 위함, §4A.3.)
# 인벤토리·remote_user·private_key_file 기본값 없음 → demo.sh가 -i targets.ini -i groups.ini로 명시.
host_key_checking = False
deprecation_warnings = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10
