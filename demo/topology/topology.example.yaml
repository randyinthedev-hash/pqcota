# 데모 토폴로지 — 이 파일이 데모가 세우는 레거시 환경 전부를 정의한다.
#
# up.sh가 이 샘플을 topology.yaml로 복사해 돌린다(복사본은 git이 무시). **편집 없이 그대로 동작**하고,
# 자기 환경에 가깝게 바꾸려면 topology.yaml을 고치면 된다. 명세: demo/topology/README.md
#
# ★ 노드 종류는 CE가 실제로 관측·빌드하는 것만: openssl / java(JCA).
#   관측 못 하는 런타임(.NET·Go 등)은 여기 없다 — 있는 척하지 않는다(§2.6).
#
# ★ 여기 적는 건 **관측 대상(레거시 환경)**뿐이다. 도구 쪽 컨테이너인 pqcota-ctl(컨트롤러)과
#   pqcota-demo-pg(인벤토리 저장소)는 생성기가 자동으로 붙이므로 적지 않는다.

networks: # 브리지 세그먼트(망 분리). 엣지 관측은 트래픽 소스의 eth0(첫 세그먼트) 기준이라,
  - corp  # 관측할 쌍은 소스 노드의 첫 세그먼트에서 서로 닿아야 한다.
  - db    # 격리 세그먼트(운영 DB tier)

nodes:
  - id: web-gw
    name: 결제 웹 게이트웨이
    kind: openssl
    role: client
    # 현대 스택. SSH 등급은 **클라이언트**가 가른다 — 여기가 트래픽 소스라, 이 노드의 OpenSSH가
    # sntrup761을 기본 제안해야 🟢 SSH가 관측된다(8.9는 알지만 기본 목록에 없다 → 9.0+ 필요).
    openssl: { fork: openssl, version: "3" }
    networks: [corp] # eth0=corp — 여기서 관측한다
    profile: { env: production, role: web, owner: 플랫폼팀 }

  - id: pay-app
    name: 결제 앱
    kind: java
    jca: { providers: [BC] } # 런타임 addProvider — 정적 스캔으론 안 보이고 attach로만 잡힌다
    networks: [corp]
    profile: { env: production, role: app, owner: 결제팀 }

  - id: pay-db
    name: 결제 DB
    kind: openssl
    role: server
    openssl: { fork: openssl, version: "1.1.1" } # 레거시(1.1.1) = 양자취약
    apps: [payment-gw, api-gw] # 한 libssl을 두 앱이 로드 → 공유 .so를 여러 앱이 쓴다(영향 반경)
    networks: [corp, db] # corp(web-gw가 도달·관측) + db(격리 tier) 양쪽에 걸침
    profile: { env: production, role: db, owner: DBA팀 }

edges: # 관측할 핸드셰이크 → 등급(🟢 PQC / 🔴 고전). 소스 web-gw의 eth0=corp에서 넷 다 도달한다.
  # TLS·SSH 각각에서 현대↔레거시가 갈리는 걸 한 화면에 보인다 — 등급은 도구가 관측대로 매긴다.
  - { from: web-gw, to: pay-app, proto: pqc, port: 8443 } # 🟢 TLS X25519MLKEM768
  - { from: web-gw, to: pay-db, proto: ssl, port: 4433 } # 🔴 TLS 고전(1.1.1 = 양자취약)
  - { from: web-gw, to: pay-app, proto: ssh, port: 22 } # 🟢 SSH sntrup761 (OpenSSH 9+)
  - { from: web-gw, to: pay-db, proto: ssh, port: 22 } # 🔴 SSH 고전 — 레거시 OS의 OpenSSH 8.2엔 PQC KEX가 없다

# ── 더 바꿔볼 수 있는 것 (topology.yaml에서) ───────────────────────────────
#  · 노드를 늘린다        — 같은 형식으로 추가하면 컨테이너·인벤토리·뷰에 그대로 반영된다
#  · fork를 바꾼다        — openssl: { fork: libressl }  (같은 soname 다른 fork, §1.2)
#  · 버전을 섞는다        — version: "1.1.1" | "3.0" | "3"  (레거시↔현대 탐지)
#  · provider를 뺀다      — jca: { providers: [] }  → BC 없는 JVM의 등급 차이
#  · 세그먼트를 더 나눈다 — networks에 추가하고 노드별 networks로 배치
