<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>브라우저 프레임 (캡처 합성용)</title>
<!--
  캡처한 웹페이지 스크린샷을 **브라우저 창처럼** 감싼다.
  헤드리스 캡처에는 주소창이 없어 "이게 웹사이트인지 발표 슬라이드인지" 구분되지 않는다.
  주소가 보이면 그 한 줄이 "실제로 열리는 사이트"라고 말해 준다.

    browser-frame.html?i=<이미지 경로>&u=<주소>

  예: browser-frame.html?i=.cap/pages.png&u=randyinthedev-hash.github.io/pqcota
-->
<style>
  :root{ --paper:#0e1420; --bar:#1c2637; --line:#2f3d54; --ink:#c3cbd8; --muted:#7d8ba1; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);display:grid;place-items:center;
       font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
  .win{width:92vw;border-radius:12px;overflow:hidden;
       box-shadow:0 24px 60px rgba(0,0,0,.55), 0 0 0 1px var(--line)}
  .bar{height:4.6vh;background:var(--bar);display:flex;align-items:center;gap:1.4vh;
       padding:0 1.8vh;border-bottom:1px solid var(--line)}
  .dots{display:flex;gap:.9vh}
  .dot{width:1.3vh;height:1.3vh;border-radius:50%}
  .url{flex:1;background:#0e1420;border:1px solid var(--line);border-radius:6px;
       height:3.1vh;display:flex;align-items:center;padding:0 1.4vh;
       color:var(--ink);font-size:1.7vh;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .url .lock{color:#7fc08a;margin-right:.9vh}
  .url .dim{color:var(--muted)}
  img{width:100%;display:block}
</style>
<div class="win">
  <div class="bar">
    <div class="dots">
      <span class="dot" style="background:#e0736b"></span>
      <span class="dot" style="background:#e2c08d"></span>
      <span class="dot" style="background:#7fc08a"></span>
    </div>
    <div class="url"><span class="lock">🔒</span><span id="u"></span></div>
  </div>
  <img id="i" alt="">
</div>
<script>
  const q = new URLSearchParams(location.search);
  const url = q.get('u') || 'randyinthedev-hash.github.io/pqcota';
  document.getElementById('i').src = q.get('i') || '';
  document.getElementById('u').innerHTML =
    url.replace(/^([^/]+)(\/.*)?$/, '$1<span class="dim">$2</span>');
</script>
</html>
