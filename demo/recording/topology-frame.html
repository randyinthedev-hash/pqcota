<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>pqcota 시연영상 — 토폴로지 프레임</title>
<!--
  demo가 만든 topology.svg는 노드가 셋뿐이라 1920×1080에 그대로 얹으면
  좌상단에 작게 붙고 나머지가 여백이 된다. 이 프레임이 화면 폭에 맞춰 키운다.
  SVG는 흰 배경을 전제로 그려지므로 어두운 무대 위에 흰 카드로 얹는다.

  쓰는 법:  topology-frame.html?f=clips/topology.svg
-->
<style>
  :root{
    --paper:#0e1420; --ink:#e6ebf2; --muted:#8b97ab; --line:#2a3548;
    --sans:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    --mono:"DejaVu Sans Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
       display:grid;place-items:center;overflow:hidden}
  .stage{width:100vw;height:100vh;display:grid;grid-template-rows:auto 1fr;
         gap:2.4vh;padding:5vh 6vw}
  .head{display:flex;align-items:baseline;gap:1.6vh}
  .head h1{font-size:3.4vh;font-weight:700;letter-spacing:-.01em}
  .head .sub{color:var(--muted);font-size:2.3vh}
  .card{background:#f7f9fc;border:1px solid var(--line);border-radius:14px;
        display:grid;place-items:center;padding:3vh 3vw;overflow:hidden}
  .card img{width:100%;height:100%;object-fit:contain}
</style>
<div class="stage">
  <div class="head">
    <h1>회선에서 실제로 협상된 것</h1>
    <span class="sub">복호화 없이 핸드셰이크만 본다 — 초록은 양자내성, 빨강은 고전</span>
  </div>
  <div class="card"><img id="g" alt="관측된 통신 엣지와 양자내성 등급"></div>
</div>
<script>
  // ?f= 로 SVG 경로를 준다. 기본은 같은 폴더의 topology.svg.
  const f = new URLSearchParams(location.search).get('f') || 'topology.svg';
  document.getElementById('g').src = f;
</script>
</html>
