# pqcota 통신 관측 — `pqcota-netcap`만 **반입 → 반복 실행 → 회수 → 정리**한다.
#
# ★ 자산 스캔(discover.yml)과 갈라 둔 이유는 **관측 주기가 다르기 때문**이다. 로드된 라이브러리와
#   provider 체인은 좀처럼 바뀌지 않아 정기적으로 한 번 보면 되지만, 통신 엣지는 **캡처하는 구간에
#   흐른 것만** 잡힌다(collectors/network/README). 한 플레이에 묶여 있으면 엣지를 더 보려고
#   `/proc` 훑기와 JVM attach까지 함께 다시 돌려야 했다.
#
# ★ collector는 여전히 **실행 후 종료하는 CLI**다. 반복되는 것은 프로세스가 아니라 호출이고,
#   일정의 주인은 이 플레이북을 부르는 쪽이다(collector 배포 설계 §5).
#
# ★ netcap은 리눅스 전용이다(AF_PACKET). Windows 노드는 이 플레이가 건너뛰며, 그 노드에 통신이
#   없다는 뜻이 아니라 이 경로로는 관측하지 못한다는 뜻이다(§2.6).
#
#   ansible-playbook -i targets.ini discovery/ansible/discover_traffic.yml \
#     -e netcap_runs=6 -e netcap_window=60 -e netcap_interval=540
- name: pqcota traffic observation (deploy → repeat → fetch → clean)
  hosts: targets
  gather_facts: true
  become: true # netcap의 CAP_NET_RAW
  vars:
    results_dir: /work/results # 컨트롤러에 결과가 모이는 곳
    collector_bin_dir: "/work/dist/linux-{{ lookup('pipe', 'uname -m') | regex_replace('^x86_64$', 'amd64') | regex_replace('^aarch64$', 'arm64') }}"
    stage_dir: /tmp/pqcota-collector

    # ── 관측 주기를 정하는 값 넷 ──
    netcap_runs: 1 # 몇 회 관측하나
    netcap_window: "{{ window | default(8) }}" # 한 회차의 관측 구간(초)
    netcap_interval: 0 # 회차 사이에 쉬는 시간(초)
    netcap_budget: 0 # 전체 상한(초). 0이면 제한 없음 — 넘으면 남은 회차를 시작하지 않는다
    netcap_iface: "" # 비우면 collector 기본값(eth0 · NETCAP_IFACE)

    # 관측이 끝난 뒤 노드를 원래대로 되돌릴지. 기본은 되돌린다.
    # 끄면 바이너리가 남아 다음 회차에 반입을 건너뛴다 — 무엇이 남는지는 아래 ④가 고지한다.
    netcap_cleanup: true
  tasks:
    - name: "리눅스 노드만"
      when: ansible_facts['os_family'] | default('') != 'Windows'
      block:
        # ── ① 반입 — netcap 하나뿐이다 ──
        - name: "① 스테이징 디렉터리"
          file: { path: "{{ stage_dir }}", state: directory, mode: "0755" }

        - name: "① pqcota-netcap 반입 (ctl → 노드)"
          copy:
            src: "{{ collector_bin_dir }}/pqcota-netcap"
            dest: "{{ stage_dir }}/pqcota-netcap"
            mode: "0755"

        # ── ② 상한 계산 — 넘으면 남은 회차를 시작하지 않는다 ──
        - name: "② 관측 상한 시각"
          set_fact:
            netcap_deadline: "{{ (lookup('pipe', 'date +%s') | int) + (netcap_budget | int) }}"
          when: (netcap_budget | int) > 0

        # ── ③ 반복 실행 + 회수 (회차마다 제 결과 파일) ──
        - name: "③ 통신 관측 {{ netcap_window }}초 × {{ netcap_runs }}회"
          # 데모는 관측 구간에 트래픽을 만들어 주는 헬퍼(pqcota-observe.sh)를 쓴다. 실환경엔 진짜
          # 트래픽이 흐르므로 netcap을 그대로 부른다 — `traffic` 변수가 있는지로 갈린다.
          shell: >-
            if [ {{ item }} -gt 1 ]; then sleep {{ netcap_interval | int }}; fi;
            {{ (traffic | default('') | length > 0)
               | ternary('/usr/local/bin/pqcota-observe.sh ' ~ inventory_hostname ~ ' ' ~ netcap_window ~ ' ' ~ (traffic | default('')),
                         stage_dir ~ '/pqcota-netcap ' ~ inventory_hostname ~ ' ' ~ netcap_iface ~ ' ' ~ netcap_window) }}
          environment:
            PATH: "{{ stage_dir }}:{{ ansible_env.PATH }}"
          register: netobs
          changed_when: false
          loop: "{{ range(1, (netcap_runs | int) + 1) | list }}"
          loop_control: { label: "{{ item }}/{{ netcap_runs }}회차" }
          when: >-
            (netcap_budget | int) == 0
            or (lookup('pipe', 'date +%s') | int) < (netcap_deadline | default(0) | int)

        - name: "   → 컨트롤러에 저장 (회차마다 한 파일)"
          copy:
            content: "{{ item.stdout }}"
            dest: "{{ results_dir }}/{{ inventory_hostname }}-net-{{ '%02d' % (item.item | int) }}.json"
          loop: "{{ netobs.results | default([]) }}"
          loop_control: { label: "{{ inventory_hostname }}-net-{{ '%02d' % (item.item | int) }}.json" }
          when: item is not skipped and (item.stdout | default('') | length) > 0
          delegate_to: localhost
          become: false

        # ── ④ 고지 — 돌지 않은 회차는 갭이지 "통신 없음"이 아니다(§2.6) ──
        - name: "④ 상한에 걸려 돌지 않은 회차"
          debug:
            msg: >-
              {{ netcap_runs }}회 가운데 {{ netobs.results | selectattr('skipped', 'defined') | list | length }}회를
              {{ netcap_budget }}초 상한에 걸려 시작하지 않았다. 관측하지 못한 구간이지 통신이 없는 것이 아니다.
          when: (netobs.results | default([]) | selectattr('skipped', 'defined') | list | length) > 0

        # ── ⑤ 정리 — 기본은 되돌린다. 끄면 무엇이 남는지 밝힌다. ──
        - name: "⑤ 노드 정리 — netcap 흔적 제거"
          file: { path: "{{ stage_dir }}", state: absent }
          when: netcap_cleanup | bool

        - name: "⑤ 정리를 끈 노드에 남는 것"
          debug:
            msg: "{{ stage_dir }}/pqcota-netcap 이 노드에 남는다(netcap_cleanup=false). 다음 회차는 반입을 건너뛴다."
          when: not (netcap_cleanup | bool)
